<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Upgrade</title>
    <meta
      name="description"
      content="Aplicación móvil PWA de rutinas, planificación semanal, estadísticas de rendimiento y sistema de niveles RPG."
    />
    <meta property="og:title" content="Upgrade" />
    <meta
      property="og:description"
      content="Aplicación móvil PWA de rutinas, planificación semanal, estadísticas de rendimiento y sistema de niveles RPG."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- PWA & Mobile Viewport Meta -->
    <meta name="theme-color" content="#08080a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Upgrade" />
    <link id="app-apple-touch-icon" rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link id="app-favicon-svg" rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link id="app-favicon-png" rel="alternate icon" type="image/png" href="/pwa-192x192.png" />

    <!-- Typography: Chakra Petch (Display), Plus Jakarta Sans (Body), JetBrains Mono (Metrics), Silkscreen (8-bit Metro LED) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Silkscreen:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <script>
      (function () {
        try {
          var raw =
            localStorage.getItem('upgrade_app_state_v3') ||
            localStorage.getItem('brote_app_state_v2') ||
            localStorage.getItem('kinetix_app_state_v2');
          var parsed = raw ? JSON.parse(raw) : null;
          var isLight = parsed && parsed.themeMode === 'light';
          var root = document.documentElement;
          root.dataset.themeMode = isLight ? 'light' : 'dark';
          root.classList.toggle('dark', !isLight);
          var metaTheme = document.querySelector('meta[name="theme-color"]');
          if (metaTheme) metaTheme.setAttribute('content', isLight ? '#eeeeec' : '#08080a');
          var manifestLink = document.querySelector('link[rel="manifest"]');
          if (manifestLink)
            manifestLink.setAttribute(
              'href',
              isLight ? '/manifest-light.webmanifest' : '/manifest-dark.webmanifest'
            );
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
