name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Instalar dependencias del proyecto
        run: npm install

      - name: Instalar herramientas de Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Compilar proyecto web
        run: npm run build || true

      - name: Generar proyecto Android y compilar APK
        run: |
          npx cap init Brote com.brote.app --web-dir dist || true
          npx cap add android || true
          npx cap sync android || true
          cd android && ./gradlew assembleDebug

      - name: Guardar ejecutable APK
        uses: actions/upload-artifact@v4
        with:
          name: Brote-Android.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
