name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js (Versión 20)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependencias del proyecto
        run: npm install --legacy-peer-deps

      - name: Instalar herramientas de Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps

      - name: Compilar proyecto web
        run: npm run build || true

      - name: Generar configuración y compilar APK
        run: |
          echo '{"appId":"com.brote.app","appName":"Brote","webDir":"dist"}' > capacitor.config.json
          npx cap add android || true
          npx cap sync android || true
          cd android && ./gradlew assembleDebug

      - name: Guardar ejecutable APK
        uses: actions/upload-artifact@v4
        with:
          name: Brote-Android.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
