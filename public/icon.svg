<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <filter id="soft-neon" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="13" result="blurWide"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="4.2" result="blurClose"/>
      <feColorMatrix in="blurWide" type="matrix" values="0 0 0 0 0.149  0 0 0 0 0.651  0 0 0 0 0.188  0 0 0 0.30 0" result="wideTint"/>
      <feColorMatrix in="blurClose" type="matrix" values="0 0 0 0 0.212  0 0 0 0 0.776  0 0 0 0 0.259  0 0 0 0.35 0" result="closeTint"/>
      <feMerge>
        <feMergeNode in="wideTint"/>
        <feMergeNode in="closeTint"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="#000000"/>

  <!-- Subtle Translucent Natural Leaf Tint -->
  <g fill="#2AA834" fill-opacity="0.12">
    <path d="M 258 160 C 202 142, 150 178, 134 256 C 170 232, 212 192, 258 160 Z"/>
    <path d="M 258 160 C 274 122, 304 94, 338 78 C 328 122, 298 152, 258 160 Z"/>
    <path d="M 323 266 C 298 256, 276 264, 264 279 C 286 287, 308 280, 323 266 Z" fill-opacity="0.10"/>
    <path d="M 324 264 C 342 240, 364 232, 384 236 C 368 258, 346 266, 324 264 Z" fill-opacity="0.10"/>
  </g>

  <!-- Soft Low-Intensity Natural Green Neon Tube + Simple Neon Ground -->
  <g filter="url(#soft-neon)" opacity="0.86">
    <g stroke="#38C844" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 164 432 Q 248 404 332 432" stroke-width="8.4"/>
      <path d="M 250 415.8 C 281 380, 326 326, 324 266 C 322 214, 292 182, 258 160" stroke-width="8.8"/>
      <path d="M 258 160 C 202 142, 150 178, 134 256 C 170 232, 212 192, 258 160 Z" stroke-width="8.2"/>
      <path d="M 258 160 C 274 122, 304 94, 338 78 C 328 122, 298 152, 258 160 Z" stroke-width="7.8"/>
      <path d="M 323 266 C 298 256, 276 264, 264 279 C 286 287, 308 280, 323 266 Z" stroke-width="6.6"/>
      <path d="M 324 264 C 342 240, 364 232, 384 236 C 368 258, 346 266, 324 264 Z" stroke-width="6.6"/>
      <path d="M 258 160 C 244 124, 248 78, 276 74 C 296 71, 300 92, 283 98" stroke-width="5.2"/>
      <path d="M 256 161 C 212 172, 178 199, 150 237" stroke-width="4.2"/>
      <path d="M 259 159 C 284 134, 305 111, 324 92" stroke-width="3.8"/>
    </g>
  </g>

  <!-- Calm Muted Sprout-Green Inner Filament -->
  <g stroke="#B8F4B2" stroke-opacity="0.68" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 164 432 Q 248 404 332 432" stroke-width="2.9"/>
    <path d="M 250 415.8 C 281 380, 326 326, 324 266 C 322 214, 292 182, 258 160" stroke-width="3.2"/>
    <path d="M 258 160 C 202 142, 150 178, 134 256 C 170 232, 212 192, 258 160 Z" stroke-width="2.9"/>
    <path d="M 258 160 C 274 122, 304 94, 338 78 C 328 122, 298 152, 258 160 Z" stroke-width="2.7"/>
    <path d="M 323 266 C 298 256, 276 264, 264 279 C 286 287, 308 280, 323 266 Z" stroke-width="2.3"/>
    <path d="M 324 264 C 342 240, 364 232, 384 236 C 368 258, 346 266, 324 264 Z" stroke-width="2.3"/>
    <path d="M 258 160 C 244 124, 248 78, 276 74 C 296 71, 300 92, 283 98" stroke-width="1.9"/>
    <path d="M 256 161 C 212 172, 178 199, 150 237" stroke-width="1.5"/>
    <path d="M 259 159 C 284 134, 305 111, 324 92" stroke-width="1.4"/>
  </g>
</svg>
